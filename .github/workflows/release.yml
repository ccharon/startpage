name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: make check
      - run: make test-js
      - run: make e2e
      - run: make vulncheck
      - run: make dist VERSION="$TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # Tags with a suffix such as v1.2.0-rc1 become pre-releases.
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${flags[@]}" \
            bin/startpage-linux-amd64 bin/startpage-linux-arm64 \
            bin/startpage-windows-amd64.exe bin/startpage-windows-amd64-noconsole.exe \
            bin/SHA256SUMS
